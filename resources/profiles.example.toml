# Overseer session profiles. `overseer <name>` sets the OVERSEER_* roster
# variables from one profile and execs its `overseer` command in the
# current pane. `overseer` alone uses `default`.
#
# Full commands only. Each value runs under `sh -c` (`cmd /C` on
# Windows), a non-interactive shell, so shell aliases from your rc file
# are not visible here. HERDR_OVERSEER=1 is set automatically when
# HERDR_ENV=1 or HC_TERMINAL_ID is set (the Herdr desktop app's core
# sets it); do not put it in a profile. A Codex entry used under the
# desktop app needs `--no-daemon`, or its commands run outside hc.
#
# A twin of this file ships with the overseer skill as
# resources/profiles.example.toml.
#
# The judge is optional and off here. It needs a TypeSafe API key, and
# it sends pane, task, and review text to that API. To use it, install
# overseer-judge and remove the `#` from a `judge` line.

# Every `overseer` command ends with a starting prompt, so the agent
# loads the skill at launch. The prompt is in escaped double quotes,
# which work under both `sh` and `cmd`.
#
# An implementer and a reviewer must edit files and run tests without
# asking you. If your agent asks by default, add its flag to those
# commands: for Claude Code, `--permission-mode auto`.

default = "claude"

# Claude Code as overseer and implementer, Codex as reviewer. A
# reviewer from another model family does not share the blind spots of
# the implementer.
[profiles.claude]
overseer    = "claude --model claude-fable-5-2 \"/overseer\""
implementer = "claude --model claude-sonnet-5-5"
reviewer    = "codex -c model_reasoning_effort=high --model gpt-6.1-sol"
# judge     = "overseer-judge"

# Claude Code only, for a machine without Codex.
[profiles.claude-only]
overseer    = "claude --model claude-fable-5-2 \"/overseer\""
implementer = "claude --model claude-sonnet-5-5"
reviewer    = "claude --model claude-opus-5-5"
# judge     = "overseer-judge"

# Codex as overseer, Claude Code for the work.
[profiles.codex]
overseer    = "codex -c model_reasoning_effort=high --model gpt-6.1-sol \"Load the overseer skill and confirm the roster.\""
implementer = "claude --model claude-sonnet-5-5"
reviewer    = "claude --model claude-opus-5-5"
# judge     = "overseer-judge"

# Any other agent that takes a prompt as its last argument works the
# same way. Remove the `#` and put in your own model names.
# [profiles.other]
# overseer    = "pi --model <provider>/<model> \"Load the overseer skill and confirm the roster.\""
# implementer = "pi --model <provider>/<cheaper-model>"
# reviewer    = "pi --model <provider>/<another-model>"
